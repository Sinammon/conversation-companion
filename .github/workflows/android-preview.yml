name: Build Android preview
on:
  workflow_dispatch:
    inputs:
      notes_url:
        description: Optional notes service URL to include in this public test build
        required: false
        type: string
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_AI_URL: ${{ inputs.notes_url }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --include=dev
      - run: npx expo prebuild --platform android --no-install
      - name: Build standalone preview for ARM64 phones
        working-directory: android
        run: bash gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: conversation-companion-android-arm64
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
