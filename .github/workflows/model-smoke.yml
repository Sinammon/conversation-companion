name: Real model smoke test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Gemini notes and questions with invented transcripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node --test tests/model/gemini.smoke.mjs
